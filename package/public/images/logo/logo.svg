<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 8 495 88" width="495" height="88">
  <defs>
    <style>
      .logo-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        fill: #6354FF;
        font-size: 34px;
        letter-spacing: -0.5px;
      }
      .bg-circle { fill: #3F41C2; }
      .icon-shape { fill: #FFFFFF; }
    </style>
  </defs>

  <g transform="translate(10, 0)">
    <!-- Icon Badge Group (On the Left) -->
    <g transform="translate(15, 16) scale(0.38)">
      <!-- Background Circle -->
      <circle class="bg-circle" cx="100" cy="100" r="90" />

      <!-- Cross & Dove Combination Graphic -->
      <g class="icon-shape">
        <!-- Cross Vertical Stem -->
        <rect x="93" y="47" width="14" height="105" rx="7" ry="7" />
        <!-- Cross Horizontal Bar -->
        <rect x="100" y="83" width="41" height="14" rx="7" ry="7" />
        
        <!-- Flying Dove Graphic -->
        <path d="M 94 82 
                 C 80 65, 50 60, 40 70 
                 C 55 77, 70 85, 80 95 
                 C 62 87, 47 87, 42 95 
                 C 55 100, 72 102, 94 100 Z" />
                 
        <path d="M 90 100 
                 C 80 115, 70 130, 55 137 
                 C 67 135, 82 122, 94 112 Z" />

        <!-- Negative Space Accent Line -->
        <path d="M 93 82 C 85 87, 82 92, 82 99" stroke="#3F41C2" stroke-width="3" fill="none" stroke-linecap="round" />
      </g>
    </g>

    <!-- Wordmark Typography ("His Grace Ministry Intl" on the Right) -->
    <text x="100" y="66" class="logo-text">His Grace Ministry Intl</text>
  </g>
</svg>