<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <style>
      .bg-circle { fill: #3F41C2; }
      .icon-shape { fill: #FFFFFF; }
    </style>
  </defs>

  <!-- Background Blue Circle -->
  <circle class="bg-circle" cx="250" cy="250" r="180" />

  <!-- Center Icon Graphic: Integrated Cross & Grace Dove -->
  <g class="icon-shape">
    <!-- Vertical Cross Stem -->
    <rect x="236" y="145" width="28" height="210" rx="14" ry="14" />
    
    <!-- Right Arm of Cross -->
    <rect x="250" y="218" width="82" height="28" rx="14" ry="14" />
    
    <!-- Flying Dove Wing (Left Side) -->
    <path d="M 238 215 
             C 210 180, 150 170, 130 190 
             C 160 205, 190 220, 210 240 
             C 175 225, 145 225, 135 240 
             C 160 250, 195 255, 238 250 Z" />
             
    <!-- Dove Body & Head Silhouette -->
    <path d="M 230 250 
             C 210 280, 190 310, 160 325 
             C 185 320, 215 295, 238 275 Z" />

    <!-- Soft negative space separation curve -->
    <path d="M 236 215 C 220 225, 215 235, 215 248" stroke="#3F41C2" stroke-width="6" fill="none" stroke-linecap="round" />
  </g>
</svg>